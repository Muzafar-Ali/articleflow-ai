name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://articleflow_ci:ci_only_password@127.0.0.1:5432/articleflow_ci?schema=public

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_USER: articleflow_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: articleflow_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U articleflow_ci -d articleflow_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2

      - name: Verify runtime versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      # Check production dependencies for security vulnerabilities
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Run quality gates
        run: npm run check

      - name: Verify PostgreSQL connectivity
        run: npm run db:check:compiled

      - name: Test PostgreSQL constraints and transaction rollback
        run: npm run test:db

      - name: Build production Docker image
        run: docker build --tag articleflow-ai:ci .

      - name: Smoke test API container
        run: |
          set -euo pipefail

          docker run --init -d \
            --name articleflow-ci-api \
            -p 127.0.0.1:3000:3000 \
            -e DATABASE_URL \
            -e TELEGRAM_WEBHOOK_SECRET=ci_only_webhook_secret_0123456789abcdef \
            articleflow-ai:ci

          ready=false

          # Wait up to 30 seconds for Express to become ready.
          for attempt in $(seq 1 30); do
            echo "Checking API readiness (attempt $attempt/30)"

            if curl --fail --silent --max-time 2 \
              -o /tmp/articleflow-api-response.json \
              http://127.0.0.1:3000/health/live \
              && grep -Fq '"service":"articleflow-api"' \
              /tmp/articleflow-api-response.json; then
              ready=true
              break
            fi

            # Fail immediately if Node.js has crashed.
            if [ "$(docker inspect -f '{{.State.Running}}' articleflow-ci-api)" != "true" ]; then
              echo "API container exited unexpectedly"
              docker inspect -f 'ExitCode={{.State.ExitCode}} Error={{.State.Error}}' articleflow-ci-api
              docker logs articleflow-ci-api
              exit 1
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "API did not become ready within the timeout"
            docker ps -a --filter name=articleflow-ci-api
            docker logs articleflow-ci-api
            exit 1
          fi

          echo "API readiness verified"

          docker stop -t 10 articleflow-ci-api

          docker logs articleflow-ci-api \
            | grep -F '"msg":"API shutdown completed"'

      - name: Smoke test worker container
        run: |
          set -euo pipefail

          docker run --init -d \
            --name articleflow-ci-worker \
            articleflow-ai:ci \
            node dist/worker/index.js

          started=false

          # Wait up to 20 seconds for worker initialization.
          for attempt in $(seq 1 20); do
            echo "Checking worker startup (attempt $attempt/20)"

            if docker logs articleflow-ci-worker 2>&1 \
              | grep -Fq '"msg":"ArticleFlow worker initialized"'; then
              started=true
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' articleflow-ci-worker)" != "true" ]; then
              echo "Worker container exited unexpectedly"
              docker logs articleflow-ci-worker
              exit 1
            fi

            sleep 1
          done

          if [ "$started" != "true" ]; then
            echo "Worker did not initialize within the timeout"
            docker logs articleflow-ci-worker
            exit 1
          fi

          # Verify the worker is still running.
          test "$(docker inspect -f '{{.State.Running}}' articleflow-ci-worker)" = "true"

          echo "Worker startup verified"

          # Verify graceful shutdown.
          docker stop -t 10 articleflow-ci-worker

          docker logs articleflow-ci-worker \
            | grep -F '"msg":"Worker shutdown completed"'

      - name: Clean up smoke test containers
        if: always()
        run: |
          docker rm -f articleflow-ci-api articleflow-ci-worker 2>/dev/null || true
